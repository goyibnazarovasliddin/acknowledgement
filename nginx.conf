events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 200M;
    server_tokens off;  # don't leak nginx version

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ---------------------------------------------------------------
        # Kerberos / NTLM negotiate (IIS-style forwarding)
        # If using IIS as front-end for Kerberos, IIS sets REMOTE_USER
        # and reverse-proxies here. Add the header below.
        # If using mod_auth_gss / Apache: same — Apache sets REMOTE_USER.
        # ---------------------------------------------------------------
        # auth_gss on;  ← only if nginx-auth-spnego module is compiled in
        # proxy_set_header REMOTE_USER $remote_user;

        location / {
            proxy_pass         http://app:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Forward Kerberos-authenticated user (set by upstream IIS/Apache):
            proxy_set_header   REMOTE_USER       $http_remote_user;
            proxy_read_timeout 120s;
        }
    }
}
