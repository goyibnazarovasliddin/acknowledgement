{% extends "base.html" %}
{% block title %}Kirish cheklangan — Agrobank{% endblock %}
{% block body %}
<div class="center-page">
  <div class="card" style="max-width:420px;text-align:center;">

    <!-- Header row with lang toggle -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
      <div style="display:flex;align-items:center;gap:.5rem;">
        <img src="/static/img/agrobank-logo.webp" alt="Agrobank" style="width:30px;height:30px;object-fit:contain;border-radius:.4rem;background:#fff;padding:2px;" />
        <span style="font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green-700);">Agrobank</span>
      </div>
      <button class="lang-toggle lang-toggle-light">RU</button>
    </div>

    <div class="icon-circle icon-circle-gray">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:.6rem;" data-i18n="restricted_title">Kirish cheklangan</h2>
    <p style="color:var(--gray-600);font-size:.9rem;line-height:1.6;" data-i18n="restricted_msg">
      Tizim sizni aniqlay olmadi. Iltimos, korporativ tarmoq orqali kiring.
    </p>
    <hr class="divider" style="margin:1.5rem 0;" />
    <p style="font-size:.78rem;color:var(--gray-400);">{{ doc.title }}</p>
  </div>
</div>
{% endblock %}
