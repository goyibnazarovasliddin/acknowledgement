<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>Yuklandi — Admin</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">
        <div class="sidebar-brand-icon" style="background:#fff;padding:3px;"><img src="/static/img/agrobank-logo.webp" alt="Agrobank" style="width:100%;height:100%;object-fit:contain;" /></div>
        <span class="sidebar-brand-name">Agrobank</span>
      </div>
      <div class="sidebar-brand-desc">ACK System</div>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-section" data-i18n="admin_management">Boshqaruv</div>
      <a href="/admin/"><svg class="icon" viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg> <span data-i18n="admin_documents">Hujjatlar</span></a>
      <a href="/admin/upload" class="active"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> <span data-i18n="admin_upload">Yuklash</span></a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">{{ admin_user[0]|upper }}</div>
      <span class="sidebar-user-name">{{ admin_user }}</span>
      <a href="/admin/logout" class="sidebar-logout" data-i18n="admin_logout">Chiqish</a>
    </div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 data-i18n="admin_uploaded_ok">Hujjat yuklandi</h1>
      <div class="admin-topbar-actions">
        <button class="lang-toggle lang-toggle-light">RU</button>
      </div>
    </div>
    <div class="admin-content">
      <div style="max-width:520px;">
        <div class="table-card" style="padding:2rem;text-align:center;">
          <div class="success-icon" style="width:64px;height:64px;margin-bottom:1.25rem;">
            <svg class="icon" style="width:1.75rem;height:1.75rem;stroke-width:3;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 style="font-weight:700;margin-bottom:.4rem;" data-i18n="admin_uploaded_ok">Hujjat yuklandi!</h2>
          <p style="color:var(--gray-600);font-size:.875rem;margin-bottom:1.5rem;">{{ doc.title }}</p>

          <div class="share-link-box">
            <span style="font-size:.72rem;color:var(--green-700);font-weight:700;white-space:nowrap;" data-i18n="share_link">Havola</span>
            <input class="share-link-input" type="text" readonly
                   value="{{ request.base_url }}d/{{ doc.share_token }}" />
            <button class="btn btn-outline btn-sm btn-copy-link"
                    data-url="{{ request.base_url }}d/{{ doc.share_token }}">
              <svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <span data-i18n="copy_link">Nusxa</span>
            </button>
          </div>

          <div style="display:flex;gap:.75rem;justify-content:center;">
            <a href="/admin/" class="btn btn-ghost" data-i18n="admin_documents">← Hujjatlar</a>
            <a href="/admin/documents/{{ doc.id }}/file" target="_blank" class="btn btn-ghost">
              <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span data-i18n="admin_view_file">Ko'rish</span>
            </a>
            <a href="/admin/upload" class="btn btn-primary" data-i18n="admin_upload_again">Yana yuklash</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
